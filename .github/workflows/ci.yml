name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra dev --extra train --extra eval

      - name: Ruff (syntax / pyflakes)
        run: uv run --no-sync ruff check audio2map tests tools demo/backend

      - name: Import layering (import-linter)
        run: uv run --no-sync lint-imports

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Pytest
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba_cache
        run: uv run --no-sync pytest
        # Data-backed tests skip when AUDIO2MAP_DATA_ROOT / raw/ is absent.
