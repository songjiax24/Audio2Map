# v2 inference overlap defaults — loaded via: audio2map-infer --config configs/data/v2.yaml
# (sample_rate / feature_dim are informational; they are fixed in features/audio/tick_features.py)

sample_rate: 22050
feature_dim: 128

window_bars: 16

# Inference overlap (context + keep + future = window_bars)
context_bars: 8
keep_bars: 4
future_bars: 4
max_seq_len: 2048
