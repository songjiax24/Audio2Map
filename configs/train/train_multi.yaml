# Formal multi-chart training (reference — copy to CLI; not loaded automatically)

# Default checkpoint dir: processed_v2/checkpoints/train_v1/

steps: 50000
batch_size: 8
samples_per_chart: 2
lr: 0.0003
d_model: 256
n_layers: 4
n_heads: 4
log_every: 50
save_every: 1000
require_grid: true

